name: Cloudflare inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check account ID matches token access
        run: |
          pnpm exec wrangler whoami --json | jq -e --arg id "$CLOUDFLARE_ACCOUNT_ID" '[.. | strings] | index($id) != null'
      - name: List D1 databases
        run: pnpm exec wrangler d1 list --json
      - name: List R2 buckets
        if: always()
        run: pnpm exec wrangler r2 bucket list
